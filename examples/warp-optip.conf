# /etc/warp-optip.conf
# 安装器会生成这个文件；这里仅作为示例。

WARP_CONN=warp-optip
WARP_IFACE=warp-optip

WARP_STATE_DIR=/var/lib/warp-optip
WARP_RESULT_CSV=/var/lib/warp-optip/result.csv
WARP_SCAN_BIN=/usr/local/lib/warp-optip/warp

WARP_SCAN_RANGES=162.159.192.0/24,162.159.193.0/24,162.159.195.0/24,188.114.96.0/22
# 默认等同关闭：扫描延迟只是初筛参考，真正的判据是 pre-up 冷握手实测。
# 想只放行明显好的候选再收紧这两个值。
WARP_MAX_LOSS=100
WARP_MAX_LATENCY=99999
WARP_LIMIT=20

# 当前已不生效：pre-up 扫描 + 实测，up 后只做持久化，不通才退回逐个实测
WARP_ON_UP_POLICY=keep

WARP_CHECK_URL=https://1.1.1.1/cdn-cgi/trace

# 扫描器内部超时、pre-up 总预算（秒）
WARP_SCAN_TIMEOUT=18
WARP_PREUP_TIMEOUT=60

# pre-up 实测：候选数量复用 WARP_LIMIT（和 up 后的修复循环一样多），
# 60 秒预算装不下多少就自然截止。
# 扫描的延迟是 UDP 层的数字，会假阳性；真正的判据是「删掉 peer 再重建、
# 逼出一次冷握手之后」curl 能不能拿到 warp=on，所以这一步放在激活完成之前做。
# 单轮预算要罩住冷握手（这里实测 3~6 秒）+ TLS + 响应，别调到 6 以下。
WARP_PREUP_ROUND_BUDGET=12

# peer 保活间隔（秒）：维持 NAT 的 UDP 映射，避免冷握手首包被 NAT 吞掉。
# pre-up 重建 peer 和写 profile 都会带上；0 = 关闭（沿用 peer 上已有设置）。
WARP_PERSISTENT_KEEPALIVE=25

# 扫描时强制探测流量走物理网络（pre-up 阶段 NM 已装好 WG 策略路由）
# NM 的规则优先级由连接 UUID 派生，范围 30768~31766；这里必须比它小
WARP_SCAN_FORCE_PHYSICAL=1
WARP_SCAN_RULE_PREF=30000
# 仅用于日志：验证扫描流量实际走物理网关
WARP_SCAN_PROBE_IP=162.159.192.1
